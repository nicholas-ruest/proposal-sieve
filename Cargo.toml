[package]
name = "proposal-sieve"
version = "0.1.0"
edition = "2024"
description = "Fail-closed whole-proposal endpoint auditing for agent and sandbox plans"
license = "MIT"
repository = "https://github.com/nicholas-ruest/proposal-sieve"
readme = "README.md"
keywords = ["security", "agent", "sandbox", "egress", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
